<div class="discussion-entry"><div class="review-heading"><strong>{{ entry.author.first_name|default:'Пользователь' }} {{ entry.author.last_name }}</strong><time class="muted" datetime="{{ entry.created_at|date:'c' }}">{{ entry.created_at|date:'d.m.Y' }}</time></div><div class="description">{{ entry.text|linebreaks }}</div>{% if request.user == entry.author or request.user.is_admin %}<form method="post" action="{% url 'web:review-delete' entry.pk %}">{% csrf_token %}<button class="text-button danger-text" type="submit">Удалить</button></form>{% endif %}</div>
