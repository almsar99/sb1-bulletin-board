{% if form.non_field_errors %}<div class="form-errors" role="alert">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
  {% if field.is_hidden %}{{ field }}{{ field.errors }}{% else %}
  <div class="form-field{% if field.errors %} has-errors{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required" aria-hidden="true"> *</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<div class="help-text" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
    {{ field.errors }}
  </div>
  {% endif %}
{% endfor %}
