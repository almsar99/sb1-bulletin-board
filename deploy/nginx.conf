# Include from nginx's http {} context, for example /etc/nginx/conf.d/market-kod.conf.
# Check the certificate and media volume paths before enabling this site.

# $uri is normalized by nginx: encoded slashes/letters cannot bypass this mask.
# Never log the original request, query string, Referer, cookies or request body.
map $uri $bulletin_log_uri {
    default $uri;
    ~*^/(?:api/users|users|signup|password-reset|login|logout|admin)(?:/|$) [auth];
}

log_format bulletin_safe '$remote_addr - [$time_local] '
                         '"$request_method $bulletin_log_uri $server_protocol" '
                         '$status $body_bytes_sent $request_time';

# nginx error messages may contain the original request and Referer. Requests
# carrying either query parameters or a Referer use a proxy without error logs.
# Early errors before this dispatch (e.g. oversized Content-Length on a public
# path) can still reach the server error log; see docs/DEPLOY.md.
map "$args:$http_referer" $bulletin_private_request {
    ":" 0;
    default 1;
}

# One shared IP bucket covers HTML, API and the short password-reset aliases.
# An empty key exempts GET and unrelated POST requests from this edge limit.
map "$request_method:$uri" $bulletin_auth_ip {
    default "";
    ~*^POST:/(?:api/users/(?:token(?:/(?:refresh|verify))?|register|signup/resend|reset_password(?:_confirm)?|set_password)|users/reset_password(?:_confirm)?|login|admin/login|signup(?:/resend-verification)?|password-reset(?:/[^/]+/[^/]+)?)/?$ $binary_remote_addr;
}

limit_req_zone $bulletin_auth_ip zone=bulletin_auth:20m rate=30r/m;

# Do not duplicate Django's Retry-After when the application itself returns 429.
map $limit_req_status $bulletin_retry_after {
    default "";
    REJECTED 2;
}

server {
    listen 80;
    listen [::]:80;
    server_name market-kod.ru www.market-kod.ru;
    access_log /var/log/nginx/market-kod.access.log bulletin_safe;
    error_log /var/log/nginx/market-kod.error.log warn;
    return 301 https://market-kod.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name market-kod.ru www.market-kod.ru;
    ssl_certificate /etc/letsencrypt/live/market-kod.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/market-kod.ru/privkey.pem;
    client_max_body_size 6m;

    access_log /var/log/nginx/market-kod.access.log bulletin_safe;
    error_log /var/log/nginx/market-kod.error.log warn;

    # These directives are inherited by both regular and named proxy locations.
    limit_req zone=bulletin_auth burst=20 nodelay;
    limit_req_status 429;
    add_header Retry-After $bulletin_retry_after always;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # A named error-page target preserves the original HTTP method and body.
    error_page 418 = @private_proxy;

    location /media/ {
        alias /var/lib/docker/volumes/bulletin-board_media_data/_data/;
        autoindex off;
        # File errors can also expose query strings and referring auth links.
        error_log /dev/null crit;
        add_header X-Content-Type-Options nosniff always;
        add_header Retry-After $bulletin_retry_after always;
    }

    location ~* ^/(?:api/users|users|signup|password-reset|login|logout|admin)(?:/|$) {
        error_log /dev/null crit;
        proxy_hide_header Referrer-Policy;
        add_header Referrer-Policy same-origin always;
        add_header Retry-After $bulletin_retry_after always;
        if ($bulletin_private_request) {
            return 418;
        }
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        if ($bulletin_private_request) {
            return 418;
        }
        # /static/ is served by WhiteNoise in Django.
        proxy_pass http://127.0.0.1:8000;
    }

    location @private_proxy {
        error_log /dev/null crit;
        proxy_hide_header Referrer-Policy;
        add_header Referrer-Policy same-origin always;
        add_header Retry-After $bulletin_retry_after always;
        proxy_pass http://127.0.0.1:8000;
    }
}
