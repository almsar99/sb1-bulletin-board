[project]
name = "bulletin-board"
version = "1.0.0"
description = "Доска объявлений"
requires-python = ">=3.14,<3.15"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
branch = true
source = ["config", "users", "ads", "web", "messaging"]
omit = ["*/migrations/*", "config/asgi.py", "config/wsgi.py"]

[tool.coverage.report]
fail_under = 75
precision = 2
show_missing = true
skip_covered = true

[tool.black]
line-length = 119
target-version = ["py314"]
extend-exclude = "migrations"

[tool.isort]
profile = "black"
line_length = 119
known_first_party = ["config", "users", "ads", "web", "messaging", "tests"]
skip_glob = ["*/migrations/*"]
