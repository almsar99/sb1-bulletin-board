name: bulletin-board

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bulletin_board}
      POSTGRES_USER: ${POSTGRES_USER:-bulletin_board}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.local}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_CONNECT_TIMEOUT: 2
      DJANGO_CACHE_URL: ${DJANGO_CACHE_URL:-database://message_rate_cache}
    ports:
      - '127.0.0.1:${WEB_PORT:-8000}:8000'
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s

volumes:
  postgres_data:
  media_data:
  static_data:
